version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: classhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: classhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
